[project]
name = "storeops-triage-agent"
version = "0.1.0"
description = "Evidence-based synthetic StoreOps incident investigation agent"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pydantic>=2"]

[project.optional-dependencies]
retrieval = ["faiss-cpu>=1.8", "sentence-transformers>=3"]
console = ["streamlit>=1.36"]

[tool.unittest]
start-directory = "tests"


